name: Deploy Module
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.1.1)
        required: true

permissions:
  contents: write

# Tag bumping reads the highest existing tag, so two runs must not overlap.
# Never cancel in flight — a cancelled run can leave a tag with no upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Nothing is tagged or published until lint + test pass on this exact commit.
  checks:
    uses: ./.github/workflows/checks.yml

  compute-version:
    needs: [checks]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Bump rc tag
        id: bump
        if: github.event_name == 'push'
        # mathieudutour/github-tag-action@v6.2
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Release tags come from the release event; main pushes only produce rc tags.
          release_branches: __none__
          pre_release_branches: main
          append_to_pre_release_tag: rc
          default_bump: patch

      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ steps.bump.outputs.new_tag }}"
          else
            VERSION="${{ inputs.version || github.ref_name }}"
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-module:
    needs: [compute-version]
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # jdx/mise-action@v4.2.4
      - name: Install toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      # Viam cloud build runs meta.json's setup (setup.sh, installs Node) and
      # build (make module.tar.gz) on each target arch, so no toolchain setup
      # is needed here.
      - name: Build and upload to Viam Registry
        # viamrobotics/build-action@v1.7.2
        uses: viamrobotics/build-action@68c0a3cef8247f2324a6de7107b09fa9e9ef8b49
        with:
          version: ${{ needs.compute-version.outputs.version }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_secret }}
          token: ${{ github.token }}
