[tools]
go = "1.26.4"
golangci-lint = "2.12.2"

[tasks.lint-go]
alias = "lint"
description = "Lint only the folders added on top of upstream/main."
# Scoped to our own packages; inherited upstream code is intentionally left
# unlinted. Add a path here when introducing a new top-level package of our own.
run = """
golangci-lint run \
  ./cmd/viam-module/... \
  ./cmd/wyze-headless/... \
  ./internal/envfile/... \
  ./internal/viammod/...
"""

[tasks.test-go]
alias = "test"
description = "Run the test suite."
run = "go test ./..."
